<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ort</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sceneWrap { margin-top:12px; position:relative; }
    .sceneNav { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .hotspotBtn {
      position:absolute;
      left: 10%;
      top: 66%;
      transform: translate(-50%, -50%);
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.45);
      color:#eef;
      cursor:pointer;
      display:none;
    }
    .hotspotBtn:hover { background: rgba(42,92,255,.22); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <h1 id="sceneTitle">Ort</h1>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <a class="btn" href="index.html">← Zur Karte</a>
          <a class="btn" id="backOutside" style="display:none;">🏠 Nach draußen</a>
        </div>
      </div>

      <div class="sceneWrap">
        <div class="scene">
          <img id="sceneImg" alt="Scene">
          <div id="sceneFallback" class="small" style="display:none; padding:16px;">
            (Bild fehlt) – prüfe den Dateinamen in <code>assets/scenes/</code>.
          </div>
        </div>

        <!-- Hotspot: ins Haus (nur draußen sichtbar) -->
        <button id="enterHouseBtn" class="hotspotBtn">🚪 Ins Haus</button>
      </div>

      <!-- Haus-Navigation (nur beim Haus außen/innen sichtbar) -->
      <div id="houseNav" class="sceneNav" style="display:none;"></div>

      <div class="small" style="margin-top:10px;">
        Nächster Schritt: Hotspots/Rätsel pro Raum.
      </div>
    </div>
  </div>

  <script type="module" src="js/scene.js"></script>
</body>
</html>
